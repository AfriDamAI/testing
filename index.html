<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfriDam AI | SaaS Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-6 font-sans text-slate-900">

    <div class="max-w-md w-full glass rounded-2xl shadow-2xl overflow-hidden border border-slate-200">
        <div class="p-8">
            <h1 class="text-2xl font-bold text-slate-800 mb-6">AfriDam <span class="text-blue-600">AI</span> Gateway</h1>
            
            <form id="uploadForm" class="space-y-4">
                <div class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center hover:border-blue-500 transition-colors cursor-pointer" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" accept="image/*" class="hidden">
                    <div id="previewContainer" class="hidden mb-4">
                        <img id="imagePreview" src="#" alt="Preview" class="mx-auto rounded-lg max-h-48 shadow-md">
                    </div>
                    <p id="uploadPrompt" class="text-sm text-slate-500 font-medium">Click to upload skin photo</p>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg">Run Analysis</button>
            </form>

            <div id="results" class="mt-8 hidden">
                <hr class="mb-6 border-slate-200">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <p class="text-slate-700 font-medium">AI Diagnosis: <span id="diagnosisText" class="text-blue-700 font-bold">---</span></p>
                    <div id="productSection" class="mt-4 pt-4 border-t border-slate-200 hidden">
                        <p class="text-xs text-slate-500 mb-2">Partner Recommendation:</p>
                        <p id="productName" class="font-bold text-slate-800 text-sm">---</p>
                        <a id="productUrl" href="#" target="_blank" class="text-blue-600 text-xs underline">View on Ene Naturals</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadForm = document.getElementById('uploadForm');
        const resultsDiv = document.getElementById('results');
        const submitBtn = document.getElementById('submitBtn');

        fileInput.onchange = evt => {
            const [file] = fileInput.files;
            if (file) {
                document.getElementById('imagePreview').src = URL.createObjectURL(file);
                document.getElementById('previewContainer').classList.remove('hidden');
                document.getElementById('uploadPrompt').classList.add('hidden');
            }
        }

        uploadForm.onsubmit = async (e) => {
            e.preventDefault();
            const file = fileInput.files[0];
            if (!file) return alert("Please select an image");

            submitBtn.disabled = true;
            submitBtn.innerText = "Analyzing...";
            resultsDiv.classList.add('hidden');

            const formData = new FormData();
            formData.append('file', file); // STRICT: Key must be 'file'

            try {
                const response = await fetch('https://afridam-backend-prod-107032494605.us-central1.run.app/api/v1/saas/scan', {
                    method: 'POST',
                    headers: { 'X-API-KEY': 'org_live_e750ae8fd2fce64417ee98af316cd9be1c2f97408a4c5b2b' },
                    body: formData
                });

                const data = await response.json();
                if (response.ok) {
                    resultsDiv.classList.remove('hidden');
                    document.getElementById('diagnosisText').innerText = data.diagnosis;
                    if (data.productRecommendations?.length > 0) {
                        const prod = data.productRecommendations[0];
                        document.getElementById('productSection').classList.remove('hidden');
                        document.getElementById('productName').innerText = prod.name;
                        document.getElementById('productUrl').href = prod.productUrl;
                    }
                } else {
                    alert(`Status ${response.status}: ${data.message}`);
                }
            } catch (err) {
                alert("Network connection error.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Run Analysis";
            }
        };
    </script>
</body>
</html>
